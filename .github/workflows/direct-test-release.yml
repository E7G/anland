name: Direct Anland Test Release

on:
  push:
    branches:
      - release/test-20260823
    paths:
      - .github/workflows/direct-test-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/test-20260823
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 ndk;29.0.13113456"
          accept-android-sdk-licenses: true

      - name: Build Plain APK
        working-directory: consumers/anland_v5/android_consumer
        run: |
          set -euo pipefail
          mkdir -p $HOME/.android
          keytool -genkeypair -v -keystore $HOME/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US" -noprompt
          chmod +x gradlew
          ./gradlew assemblePlainRelease \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Build Android display daemon
        run: |
          set -euo pipefail
          export NDK_DIR="$ANDROID_HOME/ndk/29.0.13113456"
          cmake -S . -B build_daemon_android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_daemon_android --target display_daemon -j"$(nproc)"

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release_assets
          cp consumers/anland_v5/android_consumer/app/build/outputs/apk/plain/release/app-plain-release.apk \
             release_assets/anland-v5-compat-test-20260823.apk
          cp build_daemon_android/display_daemon magisk_module/display_daemon
          chmod 755 magisk_module/display_daemon
          (cd magisk_module && zip -9 -r ../release_assets/anland-daemon-compat-test-20260823.zip .)
          (cd release_assets && sha256sum anland-v5-compat-test-20260823.apk anland-daemon-compat-test-20260823.zip > SHA256SUMS)

      - name: Create test Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compat-test-20260823
          name: Anland compat-test-20260823
          target_commitish: b80bf63b75049bc92d7deb964c67336ef4651467
          make_latest: true
          body: |
            E7G compatibility test build after syncing superturtlee/anland upstream.

            Paired with E7G/Droidspaces-OSS `compat-test-20260823`.
            Includes the E7G 5-FD audio protocol, Android IME/pointer-capture extensions,
            device optimizations, upstream Anland 5.19 changes, and Android 17 SELinux compatibility.

            Test build: Plain APK + Android display daemon Magisk package.
          files: |
            release_assets/*

      - name: Record successful release
        run: |
          set -euo pipefail
          printf '%s\n' 'https://github.com/E7G/anland/releases/tag/compat-test-20260823' > .direct-release-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .direct-release-ok
          git commit -m "ci: record direct Anland test release"
          git push origin HEAD:release/test-20260823
