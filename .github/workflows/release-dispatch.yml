name: Dispatch Test Release

on:
  push:
    branches:
      - release/test-20260823
    paths:
      - .github/workflows/release-dispatch.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/test-20260823
          fetch-depth: 0

      - name: Dispatch Anland release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main

          run_id=""
          for i in $(seq 1 60); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml --branch main --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          release_url=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json url --jq '.[0].url')
          test -n "$release_url"
          printf '%s\n' "$release_url" > .release-ok

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-ok
          git commit -m "ci: record Anland test release"
          git push origin HEAD:release/test-20260823
