name: Build NixOS Mesa ARM64 runtime

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-nixos-mesa.yml"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 4
            cores = 4
            download-buffer-size = 536870912

      - name: Fetch Mesa KGSL runtime
        run: |
          nix build \
            github:NixOS/nixpkgs/3cbe716e2346710d6e1f7c559363d14e11c32a43#legacyPackages.aarch64-linux.mesa \
            --out-link mesa-result
          out=$(readlink -f mesa-result)
          test -f "$out/share/glvnd/egl_vendor.d/50_mesa.json"
          test -d "$out/lib/dri"
          printf '%s\n' "$out" > mesa-result-path.txt
          nix-store --query --requisites "$out" > mesa-closure-paths.txt
          nix-store --export $(cat mesa-closure-paths.txt) | zstd -T0 -10 -o mesa-aarch64.nar.zst
          sha256sum mesa-aarch64.nar.zst > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: anland-mesa-aarch64
          path: |
            mesa-aarch64.nar.zst
            mesa-result-path.txt
            mesa-closure-paths.txt
            SHA256SUMS
          compression-level: 0
          retention-days: 14
