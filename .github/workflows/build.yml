name: Build APK and Daemon

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      # One plain APK and one with the Tracy client enabled for profiling
      # (product flavors in app/build.gradle; the tracy flavor also adds the
      # INTERNET permission the Tracy listener needs). Tracy build clones the
      # tag pinned in jni/CMakeLists.txt at configure time.
      fail-fast: false
      matrix:
        include:
          - task: assemblePlainRelease
            name: anland-v5
            apk: plain/release/app-plain-release.apk
          - task: assembleTracyRelease
            name: anland-v5-tracy
            apk: tracy/release/app-tracy-release.apk
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` yields the real commit
          # count for versionCode (shallow checkout would make it always 1).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 ndk;29.0.13113456"
          accept-android-sdk-licenses: true

      - name: Set NDK_DIR environment variable
        run: echo "NDK_DIR=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV

      - name: Generate debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v -keystore $HOME/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US" -noprompt

      - name: Build APK
        working-directory: consumers/anland_v5/android_consumer
        run: |
          chmod +x gradlew
          # Pass debug signing as project properties on the command line instead of
          # appending to the tracked gradle.properties, which would dirty the working
          # tree and make the git-derived versionName ("...-dirty") wrong on CI.
          ./gradlew ${{ matrix.task }} \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/${{ matrix.apk }} \
             app/build/outputs/apk/${{ matrix.name }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: consumers/anland_v5/android_consumer/app/build/outputs/apk/${{ matrix.name }}.apk

  build-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 ndk;29.0.13113456"
          accept-android-sdk-licenses: true

      - name: Set NDK_DIR environment variable
        run: echo "NDK_DIR=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV

      - name: Configure CMake for Android
        run: |
          cmake -S . -B build_daemon_android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build display_daemon
        run: cmake --build build_daemon_android --target display_daemon -j$(nproc)

      - name: Copy daemon to magisk_module directory
        run: |
          cp build_daemon_android/display_daemon magisk_module/
          chmod 755 magisk_module/display_daemon

      - name: Upload Magisk module
        uses: actions/upload-artifact@v7
        with:
          name: anland-daemon
          path: magisk_module/

      - name: Package optimized Mi Pad 4 release
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p release_assets
          cp consumers/anland_v5/android_consumer/app/build/outputs/apk/release/anland-v5.apk \
             release_assets/anland-mi-pad4-optimized.apk
          (cd magisk_module && zip -9 -r ../release_assets/anland-daemon-mi-pad4.zip .)
          (cd release_assets && sha256sum * > SHA256SUMS)

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mi-pad4-optimized-v${{ github.run_number }}
          name: Anland 小米平板 4 优化版 v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            小米平板 4 / Android 16 / Droidspaces 优化版。

            - 修复设置子页面空白和无法点击
            - 设置界面自动适配系统深色模式
            - 修复 Plasma Mobile 触摸 DOWN/MOVE/UP 丢序和上滑失效
            - 对缺失 DOWN 的触摸序列自动恢复
            - 帧循环按显示刷新率限速，避免 fallback/reconnect 满核
            - 降低无音频连接时的后台唤醒频率
            - 修复重复 fallback JNI 局部引用泄漏
          files: release_assets/*
