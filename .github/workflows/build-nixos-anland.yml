name: Build NixOS AnLand ARM64 producer

on:
  workflow_dispatch:
  push:
    paths:
      - "nix/**"
      - "producers/kde/**"
      - ".github/workflows/build-nixos-anland.yml"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            max-jobs = 4
            cores = 4
            download-buffer-size = 536870912

      - name: Build patched Plasma environment
        working-directory: nix
        run: nix build .#anland-desktop --print-build-logs --cores 4

      - name: Export Nix closure
        working-directory: nix
        run: |
          out=$(readlink -f result)
          printf '%s\n' "$out" > result-path.txt
          nix-store --query --requisites "$out" > closure-paths.txt
          nix-store --export $(cat closure-paths.txt) | zstd -T0 -10 -o anland-nixos-aarch64.nar.zst
          cp start-anland-plasma.sh ./start-anland-plasma
          chmod 0755 ./start-anland-plasma
          sha256sum anland-nixos-aarch64.nar.zst > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: anland-nixos-aarch64
          path: |
            nix/anland-nixos-aarch64.nar.zst
            nix/result-path.txt
            nix/closure-paths.txt
            nix/start-anland-plasma
            nix/SHA256SUMS
          compression-level: 0
          retention-days: 14
