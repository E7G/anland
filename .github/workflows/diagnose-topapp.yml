name: Diagnose top-app build

on:
  push:
    branches: [ 'fix/topapp-scheduling-runtime' ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 ndk;29.0.13113456"
          accept-android-sdk-licenses: true
      - name: Build quietly and print only the failure
        working-directory: consumers/anland_v5/android_consumer
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:assemblePlainRelease --console=plain --no-daemon > /tmp/topapp-build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "==== compiler/gradle error summary ===="
            grep -nE 'error:|FAILED|FAILURE:|CMake Error|ninja:|undefined reference|Execution failed|What went wrong' /tmp/topapp-build.log | tail -n 240 || true
            echo "==== final 120 lines ===="
            tail -n 120 /tmp/topapp-build.log
            exit "$rc"
          fi
          echo "Top-app plain APK build passed."
